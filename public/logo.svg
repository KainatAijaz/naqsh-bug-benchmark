<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="14" stroke="#CBA14D" stroke-width="0.8" stroke-opacity="0.65"/>
  <!-- 4 main lotus petals (cardinal) -->
  <ellipse cx="16" cy="9.5" rx="2.5" ry="4.5" fill="#CBA14D" fill-opacity="0.7"/>
  <ellipse cx="16" cy="9.5" rx="2.5" ry="4.5" fill="#CBA14D" fill-opacity="0.7" transform="rotate(90 16 16)"/>
  <ellipse cx="16" cy="9.5" rx="2.5" ry="4.5" fill="#CBA14D" fill-opacity="0.7" transform="rotate(180 16 16)"/>
  <ellipse cx="16" cy="9.5" rx="2.5" ry="4.5" fill="#CBA14D" fill-opacity="0.7" transform="rotate(270 16 16)"/>
  <!-- 4 smaller accent petals (diagonal) -->
  <ellipse cx="16" cy="10.5" rx="1.5" ry="3" fill="#CBA14D" fill-opacity="0.42" transform="rotate(45 16 16)"/>
  <ellipse cx="16" cy="10.5" rx="1.5" ry="3" fill="#CBA14D" fill-opacity="0.42" transform="rotate(135 16 16)"/>
  <ellipse cx="16" cy="10.5" rx="1.5" ry="3" fill="#CBA14D" fill-opacity="0.42" transform="rotate(225 16 16)"/>
  <ellipse cx="16" cy="10.5" rx="1.5" ry="3" fill="#CBA14D" fill-opacity="0.42" transform="rotate(315 16 16)"/>
  <!-- 8 accent dots between petals -->
  <circle cx="20.21" cy="5.84"  r="1" fill="#CBA14D" fill-opacity="0.65"/>
  <circle cx="26.16" cy="11.79" r="1" fill="#CBA14D" fill-opacity="0.65"/>
  <circle cx="26.16" cy="20.21" r="1" fill="#CBA14D" fill-opacity="0.65"/>
  <circle cx="20.21" cy="26.16" r="1" fill="#CBA14D" fill-opacity="0.65"/>
  <circle cx="11.79" cy="26.16" r="1" fill="#CBA14D" fill-opacity="0.65"/>
  <circle cx="5.84"  cy="20.21" r="1" fill="#CBA14D" fill-opacity="0.65"/>
  <circle cx="5.84"  cy="11.79" r="1" fill="#CBA14D" fill-opacity="0.65"/>
  <circle cx="11.79" cy="5.84"  r="1" fill="#CBA14D" fill-opacity="0.65"/>
  <!-- Inner accent ring -->
  <circle cx="16" cy="16" r="5" stroke="#CBA14D" stroke-width="0.6" stroke-opacity="0.5"/>
  <!-- Centre bindu -->
  <circle cx="16" cy="16" r="2.2" fill="#CBA14D" fill-opacity="0.9"/>
</svg>
